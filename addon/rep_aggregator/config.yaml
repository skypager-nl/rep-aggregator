name: Rep Index
version: "0.7.3"
slug: rep_aggregator
description: Replica watch aggregator — builds, factories, defects and tiers
arch:
  - aarch64
init: false
ingress: true
map:
  - share:rw
# LAN port for the Chrome extension. Only POST /api/capture with the token is
# accepted here; the site itself stays behind HA's login (ingress).
ports:
  8099/tcp: 8766
ports_description:
  8099/tcp: Rep Index on your network — dashboard (password login) and extension captures (token)
ingress_port: 8099
panel_icon: mdi:watch
panel_title: Rep Index
# Raw archive and photos are re-fetchable bulk; keep HA backups small.
backup_exclude:
  - "raw/*"
  - "photos/*"
  - "telegram.session"
  - "repagg.pre-purge-*"
  - "repagg.pre-clean-*"
options:
  anthropic_api_key: ""
  # Password for opening the dashboard directly at http://<pi-ip>:8766/ (outside the HA frame). Empty = off.
  web_password: ""
  claude_model: claude-opus-5
  claude_effort: high
  telegram_api_id: ""
  telegram_api_hash: ""
  telegram_analyse_hours: 6
  demo_data: false
  claude_daily_budget: 3
  # Off: nothing is sent to Claude unless you pick it on the Captures page.
  auto_analyse: false
  collectors:
    rwg: false
    reddit: false
    rwi: false
    telegram: false
  max_disk_gb: 15
  # VPN route for all forum collectors (RWG; RWI only with explicit approval). Fails closed:
  # no proxy / dead proxy / home-IP exit -> no requests. e.g. host "amsterdam.nl.socks.nordhold.net:1080"
  rwi_proxy:
    host: ""
    username: ""
    password: ""
schema:
  anthropic_api_key: password
  web_password: password?
  claude_model: list(claude-opus-5|claude-sonnet-5|claude-haiku-4-5)
  claude_effort: list(low|medium|high)
  telegram_api_id: str?
  telegram_api_hash: password?
  telegram_analyse_hours: int(1,48)
  demo_data: bool
  claude_daily_budget: float(0.5,100)
  auto_analyse: bool
  collectors:
    rwg: bool
    reddit: bool
    rwi: bool
    telegram: bool
  max_disk_gb: int(1,40)
  rwi_proxy:
    host: str?
    username: str?
    password: password?
