<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rep Index Capture — Settings</title>
    <style>
      body { max-width: 520px; margin: 48px auto; padding: 0 16px; background: #0a0a0b; color: #ece6da; font: 14px/1.5 -apple-system, BlinkMacSystemFont, Inter, sans-serif; }
      h1 { font: italic 32px Georgia, serif; color: #c9a46a; margin: 0 0 8px; }
      p { color: #8f8a80; }
      label { display: block; margin-top: 18px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8f8a80; }
      input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #121214; color: #ece6da; font: 13px ui-monospace, Menlo, monospace; }
      button { margin-top: 22px; margin-right: 8px; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #ece6da; font: inherit; cursor: pointer; }
      button.primary { background: #ece6da; color: #0a0a0b; font-weight: 600; }
      #msg { margin-top: 16px; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>Rep Index Capture</h1>
    <p>Copy both values from the <b>Captures</b> page of your Rep Index (in Home Assistant).</p>
    <label for="endpoint">Address</label>
    <input id="endpoint" placeholder="http://homeassistant.local:8766" />
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="paste token" />
    <button id="save" class="primary">Save</button><button id="test">Test connection</button>
    <div id="msg"></div>
    <script src="options.js"></script>
  </body>
</html>
