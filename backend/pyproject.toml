[project]
name = "repagg"
version = "0.1.0"
description = "Replica watch aggregator: collectors, scoring and API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
repagg = "repagg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repagg"]
